name: Doc system

on:
  push:
    branches: [main]
    paths: ["splunklib/**", "docs/**", "docsys/**", ".github/workflows/docsys.yml"]
  pull_request:
    paths: ["splunklib/**", "docs/**", "docsys/**", ".github/workflows/docsys.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docsys
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # the pipeline diffs against the base commit to limit model review
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --no-config --python 3.13 --extra dev --extra reference --extra llm
      - name: Tests
        run: uv run --no-config pytest -q
      - name: Pipeline (diff, generate if keyed, quality loop, build)
        env:
          # Optional. Without it, generation and model review are skipped and reports say so.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Model review is limited to artifacts affected since this commit (PR base, or the
          # previous head on a push). Empty on a manual run: then only the API diff decides.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Untracked folder, uploaded below, so model output from a run is never thrown away.
          SDKDOCSYS_PROPOSED: ${{ github.workspace }}/docsys/_proposals
        run: uv run --no-config sdkdocsys ci --changed-from "$BASE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site-and-reports
          path: |
            docsys/_build/html
            docsys/reports
            docsys/_proposals
